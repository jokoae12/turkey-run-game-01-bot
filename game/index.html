<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feast or Flight — A Turkey's Great Escape</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241a12; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Feast or Flight: run the turkey 1500 metres from the farmyard through the barn and out of the kitchen, jumping fences and ovens, sliding under carving knives and hiding in haystacks from the farmer"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
